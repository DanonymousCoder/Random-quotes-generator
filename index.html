<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Random Quotes Generator</title>
    <style>
      .vertical-layout {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>

  <body class="vertical-layout">
    <header class="header-icons">
      <i class="fas fa-star" id="favorite-icon" title="즐겨찾기"></i>
      <i class="fas fa-history" id="history-toggle" title="历史记录"></i>
      <i class="fas fa-user" id="mypage-icon" title="마이페이지"></i>
    </header>

    <div id="history-overlay" class="history-overlay"></div>
    <aside id="history-panel" class="history-panel">
      <div class="history-header">
        <h3>历史记录</h3>
        <div style="display: flex; gap: 10px;">
          <button id="clear-history" class="clear-btn">清空</button>
          <button id="close-history" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
      </div>
      <div id="history-list" class="history-list"></div>
    </aside>

    <div class="main-content">
    <div class="logo-container" style="text-align: center; margin-bottom: 20px;">
      <img src="assets/images/logo.png" alt="Random Quotes Generator Logo" style="width: 400px; height: auto;">
    </div>

    <div id="topic-buttons" class="topic-buttons">
      <button class="topic-btn active" data-topic="全部">全部</button>
      <button class="topic-btn" data-topic="励志">励志</button>
      <button class="topic-btn" data-topic="幽默">幽默</button>
      <button class="topic-btn" data-topic="人生">人生</button>
      <button class="topic-btn" data-topic="成功">成功</button>
      <button class="topic-btn" data-topic="智慧">智慧</button>
      <button class="topic-btn" data-topic="勇气">勇气</button>
      <button class="topic-btn" data-topic="梦想">梦想</button>
      <button class="topic-btn" data-topic="坚持">坚持</button>
      <button class="topic-btn" data-topic="态度">态度</button>
    </div>

    <div id="recommended-panel" class="recommended-panel">
      <h4><i class="fas fa-lightbulb"></i> 推荐名言</h4>
      <div id="recommended-list" class="recommended-list"></div>
    </div>

    <div class="container" style="margin-top: 10px; text-align: center;">
      <div>
        <label for="category">Choose a category:</label>
        <select id="category">
          <option value="motivational">Motivational</option>
          <option value="funny">Funny</option>
          <option value="inspirational">Inspirational</option>
        </select>
      </div>
      <div class="quote-container">
        <div class="quote-content">
          <div id="quote">Your quote will appear here...</div>
        </div>
        <div class="author-section">
          <img id="author-image" src="./assets/images/default.jpg" alt="Author Image" class="author-image" />
          <div id="author">Author Name</div>
        </div>
      </div>
      <div class="butns">
        <button id="shareTwitter" class="btn">Share on Twitter</button>
        <button id="generate" class="btn">Generate New Quote</button>
        <button id="dark-mode-toggle" class="btn">Dark Mode</button>
        <button id="copy-quote" class="btn">Copy</button>
        <button id="gen-ai" class="btn">Ai_Quotes</button>
      </div>
    </div>

    </div>

    <script src="./assets/js/script.js"></script>
    <script>
      document.getElementById("mypage-icon").addEventListener("click", () => {
        window.location.href = "like.html";
      });

      document.getElementById("gen-ai").addEventListener("click", () => {
        window.location.href = "ai.html";
      });
    </script>
  </body>
</html>
